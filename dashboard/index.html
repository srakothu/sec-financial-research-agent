<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102f2a">
  <title>Filing Desk · Company research</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="company.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<a class="skip" href="#company">Skip to company search</a>
<header class="mast"><div class="shell mast-inner">
  <a class="brand" href="./" aria-label="Filing Desk home"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span>Filing Desk</a>
  <a class="project" href="https://github.com/srakothu/sec-financial-research-agent">GitHub ↗</a>
</div></header>
<main class="shell">
  <section class="cover" aria-labelledby="page-title">
    <div class="cover-copy"><div class="eyebrow"><span class="status-dot"></span> SEC EDGAR</div>
      <h1 id="page-title">Company research<span>.</span></h1>
      <p>Explore a company’s financial performance, see what changed, and follow the numbers back to its filings.</p>
    </div>
    <div class="jacket" aria-hidden="true">
      <div class="sheet back"></div><div class="sheet middle"></div><div class="sheet front">
        <span>FORM</span><b>10-K</b><em>Annual report</em><i></i><i></i><i></i>
      </div>
    </div>
  </section>
  <form id="query" class="search-card">
    <div class="search-inputs">
      <label for="company">Company <span>Ticker, CIK, or exact SEC name</span>
        <span class="search-field"><i class="lens" aria-hidden="true"></i><input id="company" type="search" placeholder="Search a company" maxlength="128" required autocomplete="off" spellcheck="false"></span>
      </label>
      <label for="intent">Research view
        <select id="intent"><option value="company">Company overview</option><option value="fact">Financial metric</option><option value="filings">Recent filings</option><option value="event">Earnings announcement</option></select>
      </label>
    </div>
    <div id="financial" class="filters" hidden>
      <label>Metric<select id="metric"><option value="revenue">Revenue</option><option value="net_income">Net income</option><option value="operating_income">Operating income</option><option value="total_assets">Total assets</option><option value="diluted_eps">Diluted EPS</option><option value="operating_cash_flow">Operating cash flow</option></select></label>
      <label>Period<select id="period"><option value="latestAnnual">Latest annual filing</option><option value="latestQuarter">Latest quarterly filing</option><option value="annual">Full year</option><option value="1">Quarter 1</option><option value="2">Quarter 2</option><option value="3">Quarter 3</option></select></label>
      <label id="yearLabel">Fiscal year<input type="number" id="year" min="2009" required></label>
      <label id="compare" class="check"><input type="checkbox" id="growth"> Compare revenue year over year</label>
    </div>
    <div id="formFilter" class="filters" hidden><label>Form type<select id="formType"><option value="">All supported filings</option><option>10-K</option><option>10-Q</option><option>8-K</option></select></label></div>
    <div id="eventDate" class="filters" hidden><label>Filing date <span>Optional</span><input type="date" id="date"></label></div>
    <button class="primary" type="submit">Run lookup <span aria-hidden="true">↗</span></button>
  </form>
  <section id="recent" hidden><h2>Recent searches</h2><div id="history"></div></section>
  <div id="notice" role="status" class="sr-only"></div>
  <section id="results" aria-label="Research results"></section>
  <section id="explore"><div class="section-head"><h2>Explore a company</h2><span>Live lookups</span></div><div id="shortcuts" class="directory"></div></section>
  <noscript>Enable JavaScript to search live SEC filings.</noscript>
</main>
<footer class="shell"><span>Filing Desk</span><a href="https://www.sec.gov/edgar/search/">SEC filing search ↗</a></footer>
</body></html>
