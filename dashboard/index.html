<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SEC Filing Desk</title><link rel="stylesheet" href="style.css"><script defer src="samples.js"></script><script defer src="app.js"></script></head>
<body><header><span class="brand"><b class='mark' aria-hidden='true'>▥</b> Filing Desk</span><a href="https://github.com/srakothu/sec-financial-research-agent">Project on GitHub ↗</a></header>
<main><h1>Filing explorer</h1><p class="sub">Research a public company’s financial statements and earnings releases.</p>
<nav aria-label="Data source"><button id="live" aria-pressed="false">Live SEC lookup</button><button id="sample" aria-pressed="true">Apple sample</button></nav>
<div class="layout"><aside><h2>Research query</h2><form id="query"><div id="presets"><label>Sample question<select id="preset"><option value="1">Quarterly revenue growth</option><option value="0">Annual revenue</option><option value="2">Recent filings</option><option value="3">Earnings announcement</option></select></label></div>
<div id="fields" hidden><label>Ticker, CIK or SEC company name<input id="company" value="MSFT" maxlength="64" required></label><div id="shortcuts" class="chips" aria-label="Company shortcuts"></div><label>Research type<select id="intent"><option value="fact">Financial metric</option><option value="filings">Recent filings</option><option value="event">Earnings announcement</option></select></label>
<label id="formFilter" hidden>Form type<select id="formType"><option value="">All supported filings</option><option>10-K</option><option>10-Q</option><option>8-K</option></select></label><div id="financial"><label>Metric<select id="metric"><option value="revenue">Revenue</option><option value="net_income">Net income</option><option value="operating_income">Operating income</option><option value="total_assets">Total assets</option><option value="diluted_eps">Diluted EPS</option><option value="operating_cash_flow">Operating cash flow</option></select></label><label id="yearLabel">Fiscal year<input type="number" id="year" value="2025" min="2009" required></label><label>Period<select id="period"><option value="latestAnnual">Latest annual filing</option><option value="latestQuarter">Latest quarterly filing</option><option value="annual">Full year</option><option value="1">Quarter 1</option><option value="2">Quarter 2</option><option value="3">Quarter 3</option></select></label><label id="compare"><input type="checkbox" id="growth"> Compare year over year</label></div>
<label id="eventDate" hidden>Filing date (optional)<input type="date" id="date"></label><button class="run" type="submit">Run lookup</button></div></form><div id="recent" hidden><h3>Recent live lookups</h3><div id="history"></div></div></aside><section id="results" aria-live="polite"></section></div></main></body></html>
